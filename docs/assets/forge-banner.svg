      <rect x="329" y="368" width="170" height="52" rx="26"/>
      <rect x="553" y="368" width="170" height="52" rx="26"/>
      <rect x="777" y="368" width="170" height="52" rx="26"/>
      <rect x="1001" y="368" width="170" height="52" rx="26"/>
      <rect x="1225" y="368" width="170" height="52" rx="26"/>
    </g>
    <text x="190" y="401">Question</text>
    <text x="414" y="401">Evidence</text>
    <text x="638" y="401">Hypothesis</text>
    <text x="862" y="401">Experiment</text>
    <text x="1086" y="401">Result</text>
    <text x="1310" y="401">Next decision</text>
