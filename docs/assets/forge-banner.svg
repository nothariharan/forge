    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect x="0" y="0" width="1500" height="6" fill="url(#accent)"/>

  <text x="750" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" letter-spacing="6" fill="#9aa4c7">7TH GLOBAL AI HACKATHON  ·  CHALLENGE 03  ·  AGENTIC SCIENTIFIC DISCOVERY</text>
  <text x="750" y="238" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="128" font-weight="800" letter-spacing="14" fill="url(#accent)">FORGE</text>
  <text x="750" y="298" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#e8ecf8">An auditable AI research lab, orchestrated with Omnigent</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#e8ecf8" text-anchor="middle">
