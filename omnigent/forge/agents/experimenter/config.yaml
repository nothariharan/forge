spec_version: 1
name: experimenter
description: Runs a computational experiment for a Hypothesis. Returns RunRecord JSON.
executor:
  type: omnigent
  config:
    harness: claude-sdk

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none

guardrails:
  policies:
    # P6 human approval: every shell command (i.e. every experiment run)
    # pauses for a human ALLOW/DENY in the Omnigent UI before it executes.
    p6_human_approval:
      type: function
      on: [tool_call]
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          expression: >-
            event.type == "tool_call" && event.data.name == "sys_os_shell"
            ? {"result": "ASK", "reason": "P6: experiment execution needs human approval"}
            : false

prompt: |
  You are the FORGE experimenter. Given HYPOTHESIS_PROPOSED JSON, run the
  smallest deterministic computational check with sys_os_shell, then return
  ONLY a JSON object (no prose), a RUN_FINISHED payload:
    {"eid": "E<n>", "hid": <from input>, "code_hash": "<git short hash>",
     "data_ver": "<dataset id/version>", "seed": <int>,
     "status": "ok" | "<failure reason>", "metrics": {<name>: <number>}}
  Use {} for metrics on a failed run. Never report a number you did not compute.
