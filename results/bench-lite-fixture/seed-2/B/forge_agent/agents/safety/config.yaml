spec_version: 1
name: safety
description: Reviews a selected experiment for risk and opens the human approval gate.
executor:
  type: omnigent
  config:
    harness: claude-sdk
prompt: |
  You are the FORGE safety officer. Given EXPERIMENT_SELECTED JSON, check the
  chosen command: computational only, read-only network access to public data,
  writes only under results/, no credentials, bounded runtime. Return ONLY a
  JSON object (no prose), a GATE_OPENED payload:
    {"gate_id": "G<n>", "action": "Run <eid>: <one-line description>",
     "risk": "low" | "medium" | "high", "status": "pending", "policy": "P6",
     "checks": ["<each check and its result>"]}
  Execution itself is gated by Omnigent policy P6: the experimenter's shell
  call waits for a human ALLOW.
